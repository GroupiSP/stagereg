[project]
name = "stagereg"
version = "0.5.0"
description = "Stage-oriented probabilistic regression"
readme = "README.md"
authors = [
    { name = "Giorgio Tosti Balducci", email = "g.b.l.tostibalducci@tudelft.nl" },
    { name = "Intelligent System Prognostics for Operations & Maintenance Research Group" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
jax = [
    "flax>=0.11",
    "jax>=0.6",
    "optax>=0.2.4",
]
plot = [
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/GroupiSP/stagereg"
Documentation = "https://groupisp.github.io/stagereg/"
Issues = "https://github.com/GroupiSP/stagereg/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The sdist also carries the tests, so downstream packagers can check the build. The examples
# stay in the repository, so the tests that exercise them need a repository checkout.
source-include = ["tests/**"]
source-exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = [
    "docformatter>=1.7.7",
    "hypothesis>=6.140.4",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-markdown-docs>=0.9.2",
    "pyyaml>=6.0",
    "ruff>=0.14.9",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

example-cmapss = [
    "flax>=0.11",
    "jax>=0.6",
    "optax>=0.2.4",
    "pandas>=2.2",
    "scikit-learn>=1.9.0",
    "seaborn==0.13.2",
    "matplotlib>=3.11.0"
]

example-tracking = [
    "flax>=0.11",
    "jax>=0.6",
    "optax>=0.2.4",
    "matplotlib>=3.11.0",
    "tensorboard>=2.20",
    "tensorboardX>=2.6.4",
]

[tool.docformatter]
recursive = true
black = true
style = "google"

[tool.pytest.ini_options]
testpaths = ["tests", "docs_site", "README.md"]
addopts = ["--markdown-docs", "--markdown-docs-syntax=superfences"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = false

[tool.ruff.lint.per-file-ignores]
"examples/jax/cmapss/*.py" = ["E402"]
"tests/jax/test_cmapss_*.py" = ["E402"]
"examples/jax/tracking/*.py" = ["E402"]
